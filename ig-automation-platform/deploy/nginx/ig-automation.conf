# Nginx site for Reel Automation. Installed by setup-server.sh as
# /etc/nginx/sites-available/ig-automation.conf with __DOMAIN__ replaced.
#
#   browser ──HTTPS──▶ Nginx ──┬─ /            → React dashboard (static files)
#   Meta    ──HTTPS──▶         └─ /api/*       → Node.js on 127.0.0.1:4000

# Extra brute-force protection for the login endpoint (the app also rate-limits it).
limit_req_zone $binary_remote_addr zone=igauto_login:10m rate=10r/m;

upstream igauto_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt certificate renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "listen … http2" works on Ubuntu 24.04's Nginx 1.24 (the newer "http2 on;" needs 1.25.1+).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:igauto_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /opt/ig-automation/current/frontend/dist;
    index index.html;

    include /etc/nginx/snippets/ig-automation-security.conf;

    # ── API (and Meta webhooks) → Node.js ──
    location /api/ {
        proxy_pass http://igauto_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    location = /api/auth/login {
        limit_req zone=igauto_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://igauto_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Built assets: file names contain a content hash → cache forever ──
    location /assets/ {
        include /etc/nginx/snippets/ig-automation-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Dashboard (single-page app): every other path serves index.html, never cached ──
    location / {
        include /etc/nginx/snippets/ig-automation-security.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Never serve hidden files (e.g. .env) even if one ends up in the web root by mistake.
    location ~ /\. {
        deny all;
        return 404;
    }
}
